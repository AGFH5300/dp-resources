name: EB0383 test diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/qb-eb0383-diagnostics.yml'
      - 'components/question-bank/**'
      - 'lib/question-bank/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  test-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --silent
      - name: Run complete tests
        id: tests
        continue-on-error: true
        shell: bash
        run: npm test > test-output.log 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: eb0383-test-output
          path: test-output.log
      - name: Preserve test result
        if: steps.tests.outcome == 'failure'
        run: exit 1
