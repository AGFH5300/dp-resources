name: Full production-to-now release audit

on:
  push:
    branches:
      - release/full-post-production-audit-20260916

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[full-release-audit-20260916]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/full-post-production-audit-20260916
          fetch-depth: 0
      - run: python3 scripts/tmp-full-release-audit-20260916.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/whats-new.ts app/changelog/page.tsx lib/changelog.ts docs/POST_PRODUCTION_RELEASE_AUDIT_2026-09-16.md tests/post-production-live-data-release-audit.test.ts
          git commit -m "Complete live-data release audit [full-release-audit-20260916]"
          git push origin HEAD:release/full-post-production-audit-20260916
