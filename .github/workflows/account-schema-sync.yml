name: Account schema sync

on:
  push:
    branches:
      - feature/settings-account-centre
    paths:
      - .github/workflows/account-schema-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feature/settings-account-centre
          fetch-depth: 0
      - name: Pin canonical account settings trigger search path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/schema.sql')
          text = path.read_text()
          old = """create or replace function public.dp_resource_user_settings_set_updated_at()\nreturns trigger language plpgsql as $$"""
          new = """create or replace function public.dp_resource_user_settings_set_updated_at()\nreturns trigger\nlanguage plpgsql\nset search_path = public\nas $$"""
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('Expected account settings trigger definition not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit canonical schema
        run: |
          if git diff --quiet -- supabase/schema.sql; then
            echo "supabase/schema.sql already aligned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/schema.sql
          git commit -m "Align canonical account settings schema"
          git push origin HEAD:feature/settings-account-centre
