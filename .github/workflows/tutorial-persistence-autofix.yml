name: Tutorial persistence autofix

on:
  push:
    branches:
      - fix/tutorial-step-load-speed

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[tutorial-persistence-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tutorial-step-load-speed
          fetch-depth: 0
      - name: Apply tutorial persistence patch
        run: python3 scripts/tmp-persist-tutorial-controller.py
      - name: Commit tutorial persistence patch
        run: |
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/layout.tsx components/nav.tsx components/tutorial/tutorial-controller.tsx tests/tutorial-onboarding.test.ts
          git commit -m "Persist tutorial across route transitions [tutorial-persistence-fix]"
          git push origin HEAD:fix/tutorial-step-load-speed
