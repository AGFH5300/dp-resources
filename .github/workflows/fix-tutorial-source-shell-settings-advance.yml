name: Fix tutorial source shell settings advance

on:
  push:
    branches:
      - fix/tutorial-source-shell-settings-advance

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[tutorial-source-settings]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tutorial-source-shell-settings-advance
          fetch-depth: 0
      - run: python3 scripts/tmp-fix-tutorial-source-shell-settings-advance.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/question-bank/build/loading.tsx components/tutorial/tutorial-controller.tsx tests/tutorial-onboarding.test.ts
          git commit -m "Fix tutorial source shell and Settings advance [tutorial-source-settings]"
          git push origin HEAD:fix/tutorial-source-shell-settings-advance
