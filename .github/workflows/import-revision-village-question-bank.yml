name: Import Revision Village question bank

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/import-revision-village-question-bank.yml'

permissions:
  contents: write

concurrency:
  group: revision-village-question-bank-production-import
  cancel-in-progress: false

jobs:
  import:
    name: Audit and import authorized Revision Village archive
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/revision-village-question-bank-import'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_QUESTION_BANK_BUCKET: ${{ secrets.R2_QUESTION_BANK_BUCKET }}
      R2_PDF_PREVIEW_BUCKET: ${{ secrets.R2_PDF_PREVIEW_BUCKET }}

    steps:
      - name: Check out reviewed branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install existing dependencies
        run: npm ci

      - name: Download verified importer source bundle
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import { createWriteStream } from 'node:fs';
          import { readFile } from 'node:fs/promises';
          import { pipeline } from 'node:stream/promises';
          import { google } from 'googleapis';

          function key(value = '') {
            let result = value.trim();
            if ((result.startsWith('"') && result.endsWith('"')) || (result.startsWith("'") && result.endsWith("'"))) result = result.slice(1, -1);
            return result.replace(/\\n/g, '\n').replace(/\\/g, '').trim();
          }
          const auth = new google.auth.JWT({
            email: process.env.GOOGLE_SERVICE_ACCOUNT_EMAIL,
            key: key(process.env.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY),
            scopes: ['https://www.googleapis.com/auth/drive.readonly'],
          });
          const drive = google.drive({ version: 'v3', auth });
          const response = await drive.files.get(
            { fileId: '1sTyIQkuTgubbiAWHIGHNOz3v1Lvud9K6', alt: 'media', supportsAllDrives: true },
            { responseType: 'stream' },
          );
          await pipeline(response.data, createWriteStream('/tmp/revision-village-import-code-v1.zip'));
          const body = await readFile('/tmp/revision-village-import-code-v1.zip');
          const digest = crypto.createHash('sha256').update(body).digest('hex');
          if (digest !== 'b86999dac790ecbaac7c9c13869d507d0f01722a35082130c2f6bb8be171e6cc') throw new Error(`Importer bundle SHA mismatch: ${digest}`);
          NODE
          unzip -o /tmp/revision-village-import-code-v1.zip -d "$GITHUB_WORKSPACE"

      - name: Commit reviewed importer files to the pull request branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json scripts/download-revision-village-import.mjs scripts/import-revision-village-question-bank.mjs scripts/question-bank/revision-village.mjs supabase/migrations/20260727114500_revision_village_question_bank_support.sql docs/REVISION_VILLAGE_QUESTION_BANK_IMPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "Add audited Revision Village question bank importer"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Validate importer syntax and production configuration
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/download-revision-village-import.mjs
          node --check scripts/import-revision-village-question-bank.mjs
          node --check scripts/question-bank/revision-village.mjs
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$GOOGLE_SERVICE_ACCOUNT_EMAIL"
          test -n "$GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY"
          test -n "$R2_ACCOUNT_ID" || test -n "$R2_ENDPOINT"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          test -n "${R2_QUESTION_BANK_BUCKET:-${R2_PDF_PREVIEW_BUCKET:-}}"

      - name: Download and verify authorized content archive
        run: node scripts/download-revision-village-import.mjs .revision-village-import

      - name: Verify source archive and checksums
        run: >-
          npm run question-bank:revision-village --
          --archive .revision-village-import/RevisionVillage-question-bank-import-20260727T104233-audited-media.zip
          --mode audit
          --report .question-bank-reports/revision-village-audit.json

      - name: Compare and dry-run against production
        run: >-
          npm run question-bank:revision-village --
          --archive .revision-village-import/RevisionVillage-question-bank-import-20260727T104233-audited-media.zip
          --mode dry-run
          --storage-provider r2
          --storage-bucket "${R2_QUESTION_BANK_BUCKET:-$R2_PDF_PREVIEW_BUCKET}"
          --report .question-bank-reports/revision-village-dry-run.json

      - name: Import Supabase rows and private R2 assets
        run: >-
          npm run question-bank:revision-village --
          --archive .revision-village-import/RevisionVillage-question-bank-import-20260727T104233-audited-media.zip
          --mode all
          --storage-provider r2
          --storage-bucket "${R2_QUESTION_BANK_BUCKET:-$R2_PDF_PREVIEW_BUCKET}"
          --workers 8
          --batch-size 250
          --confirm-production
          --report .question-bank-reports/revision-village-all.json

      - name: Upload import reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-village-question-bank-import-reports
          path: |
            .question-bank-reports/*.json
            .revision-village-import/download-report.json
          if-no-files-found: warn
          retention-days: 30
