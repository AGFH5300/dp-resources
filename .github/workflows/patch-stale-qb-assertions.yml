name: Patch stale Question Bank assertions

on:
  push:
    branches:
      - fix/qb-multi-section-interactions
    paths:
      - .github/workflows/patch-stale-qb-assertions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qb-multi-section-interactions
          fetch-depth: 0

      - name: Update stale section assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/question-bank.test.tsx')
          source = path.read_text()
          replacements = {
              "expect(workspace).toContain(\"interactive.selectionMode === 'multiple'\");":
                  "expect(workspace).toContain(\"section.selectionMode === 'multiple'\");",
              "expect(workspace).toContain('onClick={() => toggleChoice(choice.id)}');":
                  "expect(workspace).toContain('onClick={() => toggleChoice(section.id, choice.id)}');",
              "expect(workspace).toContain('onClick={() => void checkAnswer()}');":
                  "expect(workspace).toContain('onClick={() => void checkSection(section.id)}');",
              "expect(workspace).toContain('interactive.requiredSelectionCount');":
                  "expect(workspace).toContain('section.requiredSelectionCount');",
          }

          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              source = source.replace(old, new)

          for old, new in replacements.items():
              if old in source or source.count(new) != 1:
                  raise SystemExit(f'Assertion replacement verification failed for {new!r}')

          path.write_text(source)
          PY

      - name: Remove one-use workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/patch-stale-qb-assertions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/question-bank.test.tsx
          git commit -m "Update section-scoped Question Bank assertions"
          git push origin HEAD:fix/qb-multi-section-interactions
