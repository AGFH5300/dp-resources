name: Verify Render production PDF search deployment

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Wait for exact Render production commit
        shell: bash
        run: |
          set -euo pipefail
          url='https://dp.resources.anshgupta.cc/api/health/pdf-search-storage'
          for attempt in $(seq 1 60); do
            body="$(curl --silent --show-error --fail --max-time 15 --header 'Cache-Control: no-cache' "$url" || true)"
            if printf '%s' "$body" | grep -Fq '"pdfSearchStorage":"dual-object-v1"' \
              && printf '%s' "$body" | grep -Fq '"deploymentProvider":"render"' \
              && printf '%s' "$body" | grep -Fq "\"renderCommit\":\"$EXPECTED_SHA\""; then
              printf 'Exact Render production commit verified on attempt %s: %s\n' "$attempt" "$body"
              exit 0
            fi
            printf 'Attempt %s: expected Render commit %s is not live yet. Body: %.300s\n' "$attempt" "$EXPECTED_SHA" "$body"
            sleep 10
          done
          echo "Render production did not reach expected commit $EXPECTED_SHA within the verification window." >&2
          exit 1
