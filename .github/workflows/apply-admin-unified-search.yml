name: Apply unified admin content search

on:
  push:
    branches: [fix/admin-unified-content-search]
    paths:
      - scripts/fix-admin-unified-search-output.mjs
      - .github/workflows/apply-admin-unified-search.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-unified-content-search
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fix-admin-unified-search-output.mjs
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/page.tsx
          git commit -m "Fix unified admin search output"
          git push origin HEAD:fix/admin-unified-content-search
