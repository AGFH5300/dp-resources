name: Backfill PDF search manifests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-pdf-search-manifests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-search-manifest-production-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill and verify dual PDF search manifests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PDF_PREVIEW_BUCKET: ${{ secrets.R2_PDF_PREVIEW_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      PDF_SEARCH_MANIFEST_FALLBACK_BUCKET: pdf-previews

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          test -n "$R2_PDF_PREVIEW_BUCKET"
          test -n "$PDF_SEARCH_MANIFEST_FALLBACK_BUCKET"
          test -n "$R2_ACCOUNT_ID" || test -n "$R2_ENDPOINT"

      - name: Ensure private Supabase fallback bucket exists
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js';

          const url = process.env.NEXT_PUBLIC_SUPABASE_URL?.trim();
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY?.trim();
          const bucket = process.env.PDF_SEARCH_MANIFEST_FALLBACK_BUCKET?.trim();
          if (!url || !key || !bucket) throw new Error('Fallback bucket configuration is incomplete');

          const supabase = createClient(url, key, {
            auth: { persistSession: false, autoRefreshToken: false },
          });
          const { data, error } = await supabase.storage.getBucket(bucket);
          if (!error && data) {
            if (data.public) {
              const { error: updateError } = await supabase.storage.updateBucket(bucket, { public: false });
              if (updateError) throw updateError;
            }
            console.log(JSON.stringify({ event: 'pdf_search_fallback_bucket_ready', bucket, created: false }));
            process.exit(0);
          }

          const message = String(error?.message || '');
          const status = Number(error?.status || error?.statusCode || 0);
          if (status !== 404 && !/bucket not found/i.test(message)) throw error;

          const { error: createError } = await supabase.storage.createBucket(bucket, { public: false });
          if (createError && !/already exists/i.test(String(createError.message || ''))) throw createError;
          console.log(JSON.stringify({ event: 'pdf_search_fallback_bucket_ready', bucket, created: true }));
          NODE

      - name: Verify private R2 read/write access
        run: node scripts/verify-r2-preview-storage.mjs

      - name: Validate complete manifest inputs without writing
        run: node scripts/backfill-pdf-search-manifests.mjs

      - name: Backfill and SHA-verify both private copies
        run: node scripts/backfill-pdf-search-manifests.mjs --write --confirm-production

      - name: Verify second pass is idempotent and current
        run: |
          set -euo pipefail
          node scripts/backfill-pdf-search-manifests.mjs --write --confirm-production | tee /tmp/pdf-manifest-verify.log
          if grep -q '"action":"created-and-verified"' /tmp/pdf-manifest-verify.log; then
            echo 'Unexpected manifest creation during verification pass' >&2
            exit 1
          fi
          if grep -q '"action":"replaced-and-verified"' /tmp/pdf-manifest-verify.log; then
            echo 'Unexpected manifest replacement during verification pass' >&2
            exit 1
          fi
          if grep -q '"action":"failed"' /tmp/pdf-manifest-verify.log; then
            echo 'Manifest verification failure detected' >&2
            exit 1
          fi
          grep '"event":"pdf_search_manifest_summary"' /tmp/pdf-manifest-verify.log >> "$GITHUB_STEP_SUMMARY"

      - name: Record safety boundary
        if: always()
        run: |
          {
            echo ''
            echo 'This workflow reads PDF search_text from Supabase and writes only private R2 and Supabase Storage manifest objects. It does not update/delete PostgreSQL rows or modify original Google Drive PDFs.'
          } >> "$GITHUB_STEP_SUMMARY"
