name: Finalize textbook library

on:
  push:
    branches:
      - ops/textbook-library-finalize-2026-09-08
    paths:
      - .github/workflows/prepare-pdf-previews.yml

permissions:
  contents: read

concurrency:
  group: pdf-preview-generation
  cancel-in-progress: false

jobs:
  finalize-textbook-library:
    name: Finalize textbook library, index, and previews (retry)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
      GOOGLE_DRIVE_FOLDER_ID: '141RinswVOzK8KaH9ixnoFBTR6IQD1gMy'
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PDF_PREVIEW_BUCKET: ${{ secrets.R2_PDF_PREVIEW_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      MAX_TOTAL_PREVIEW_GIB: '8'
      PDF_PREVIEW_STORAGE_PROVIDER: 'r2'
      PDF_PREVIEW_DPI: '150'
      PDF_PREVIEW_JPEG_QUALITY: '76'
      PDF_PREVIEW_BATCH_SIZE: '40'
      PDF_PREVIEW_UPLOAD_CONCURRENCY: '6'
      PDF_PREVIEW_UPLOAD_ATTEMPTS: '5'

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install dependencies
        run: npm ci

      - name: Verify private R2 read and write access
        run: node scripts/verify-r2-preview-storage.mjs

      - name: Diagnose any remaining old ESS source
        run: node scripts/ops-locate-old-ess.mjs

      - name: Verify Drive placements, clean obsolete previews, and refresh index
        run: node scripts/ops-finalize-textbook-library.mjs

      - name: Prepare and verify new large textbook previews
        run: node scripts/ops-prepare-textbook-previews.mjs

      - name: Record source-file safety
        if: always()
        run: |
          {
            echo ""
            echo "The ops workflow only read active Google Drive source files. It did not rename, move, compress, overwrite, or delete Drive originals."
            echo "Obsolete Drive sources were required to already be trashed before their derivative preview data or stale index rows could be removed."
          } >> "$GITHUB_STEP_SUMMARY"
