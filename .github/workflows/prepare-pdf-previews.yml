name: Finalize textbook library

on:
  push:
    branches:
      - ops/textbook-library-finalize-2026-09-08
    paths:
      - .github/workflows/prepare-pdf-previews.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: textbook-preview-acceleration
  cancel-in-progress: true

jobs:
  prepare:
    name: Wait for index and retire sequential preview run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PDF_PREVIEW_BUCKET: ${{ secrets.R2_PDF_PREVIEW_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      MAX_TOTAL_PREVIEW_GIB: '8'
      OLD_SEQUENTIAL_RUN_ID: '34253445322'

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for the current safe Drive/index cleanup to finish
        run: node scripts/ops-parallel-textbook-previews.mjs --mode=wait-index

      - name: Verify private R2 access before parallel work
        run: node scripts/verify-r2-preview-storage.mjs

      - name: Cancel only the superseded sequential preview run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${OLD_SEQUENTIAL_RUN_ID}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          status="$(curl -fsSL "${headers[@]}" "$API" | jq -r '.status')"
          echo "Sequential run status before retirement: $status"

          if [ "$status" != "completed" ]; then
            code="$(curl -sS -o /tmp/cancel-response.txt -w '%{http_code}' -X POST "${headers[@]}" "$API/cancel")"
            if [ "$code" != "202" ] && [ "$code" != "409" ]; then
              cat /tmp/cancel-response.txt || true
              echo "Unexpected cancellation response: HTTP $code"
              exit 1
            fi
          fi

          for _ in $(seq 1 90); do
            status="$(curl -fsSL "${headers[@]}" "$API" | jq -r '.status')"
            if [ "$status" = "completed" ]; then
              conclusion="$(curl -fsSL "${headers[@]}" "$API" | jq -r '.conclusion')"
              echo "Sequential run retired: status=$status conclusion=$conclusion"
              sleep 3
              exit 0
            fi
            sleep 2
          done

          echo "Sequential run did not settle after cancellation request."
          exit 1

  previews:
    name: Preview worker ${{ matrix.worker }} of 4
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        worker: [0, 1, 2, 3]
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PDF_PREVIEW_BUCKET: ${{ secrets.R2_PDF_PREVIEW_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      PDF_PREVIEW_STORAGE_PROVIDER: r2
      PDF_PREVIEW_DPI: '150'
      PDF_PREVIEW_JPEG_QUALITY: '76'
      PDF_PREVIEW_BATCH_SIZE: '40'
      PDF_PREVIEW_UPLOAD_CONCURRENCY: '6'
      PDF_PREVIEW_UPLOAD_ATTEMPTS: '5'
      MAX_TOTAL_PREVIEW_GIB: '8'

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install dependencies
        run: npm ci

      - name: Prepare assigned textbooks on an isolated runner
        run: >-
          node scripts/ops-parallel-textbook-previews.mjs
          --mode=shard
          --shard-index=${{ matrix.worker }}
          --shard-count=4

  audit:
    name: Final textbook preview audit
    needs: previews
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_PDF_PREVIEW_BUCKET: ${{ secrets.R2_PDF_PREVIEW_BUCKET }}
      MAX_TOTAL_PREVIEW_GIB: '8'

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify all replacements, deletions, index rows and R2 previews
        run: node scripts/ops-parallel-textbook-previews.mjs --mode=audit

      - name: Record accelerated completion
        if: always()
        run: |
          {
            echo "## Accelerated textbook preview run"
            echo ""
            echo "Four isolated GitHub runners were used for book-level parallelism."
            echo "Each PDF worker retained six-way page upload concurrency."
            echo "Production deployment and Google Drive originals were not modified by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
