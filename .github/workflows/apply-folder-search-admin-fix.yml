name: Apply folder search and admin case-state fix

on:
  push:
    branches:
      - fix/folder-search-admin-case-state

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/folder-search-admin-case-state
          fetch-depth: 0

      - name: Apply focused source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          patch_path = Path('tests/.apply-folder-search-admin-fix.py')
          exec(compile(patch_path.read_text(), str(patch_path), 'exec'))
          patch_path.unlink()
          PY

          rm .github/workflows/apply-folder-search-admin-fix.yml
          rm .github/workflows/apply-folder-search-admin-fix-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib supabase tests .github/workflows
          git commit -m "Add folder-scoped search and isolate admin case state"
          git push origin HEAD:fix/folder-search-admin-case-state
