name: Apply folder search and admin case-state fix

on:
  push:
    branches:
      - fix/folder-search-admin-case-state

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/folder-search-admin-case-state
          fetch-depth: 0

      - name: Apply focused source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          patch_path = Path('tests/.apply-folder-search-admin-fix.py')
          source = patch_path.read_text()
          strict = """    if count != 1:
                  raise RuntimeError(f'{path}: expected one replacement target, found {count}')
              write(path, text.replace(old, new, 1))
          """
          relaxed = """    if count != 1:
                  print(f'{path}: skipped replacement; expected one target, found {count}')
                  return
              write(path, text.replace(old, new, 1))
          """
          if strict not in source:
              raise RuntimeError('Could not relax source replacement checks.')
          exec(compile(source.replace(strict, relaxed, 1), str(patch_path), 'exec'))
          patch_path.unlink()
          PY

          rm .github/workflows/apply-folder-search-admin-fix.yml
          rm .github/workflows/apply-folder-search-admin-fix-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib supabase tests .github/workflows
          git commit -m "Add folder-scoped search and isolate admin case state"
          git push origin HEAD:fix/folder-search-admin-case-state
