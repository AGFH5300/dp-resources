name: Apply CodeQL and search fixes

on:
  push:
    branches: [fix/codeql-and-search-aliases]
    paths:
      - scripts/apply-codeql-search-fixes.mjs
      - .github/workflows/apply-codeql-search-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codeql-and-search-aliases
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-codeql-search-fixes.mjs
      - name: Commit generated refactor
        run: |
          git checkout -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/search/route.ts lib/drive.ts lib/pptx-audio.ts scripts/prepare-pdf-previews-batch.mjs scripts/question-bank/capture-pestle.mjs scripts/question-bank/pestle.mjs
          git commit -m "Fix CodeQL findings and expand resource search aliases"
          git push origin HEAD:fix/codeql-and-search-aliases
