name: One-time Exam-Mate production import

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RESUME-EXAM-MATE-PRODUCTION-IMPORT
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: exam-mate-production-import
  cancel-in-progress: false

jobs:
  import:
    name: Audit, import and verify Exam-Mate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_QUESTION_BANK_BUCKET: ${{ secrets.R2_PDF_PREVIEW_BUCKET }}
      R2_PDF_PREVIEW_BUCKET: ${{ secrets.R2_PDF_PREVIEW_BUCKET }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}

    steps:
      - name: Check out merged importer
        uses: actions/checkout@v5

      - name: Enforce one-time production guard
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "RESUME-EXAM-MATE-PRODUCTION-IMPORT"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize private runner workspace
        shell: bash
        run: echo "ROOT=$RUNNER_TEMP/ExamMate-index-20260729-223333" >> "$GITHUB_ENV"

      - name: Validate protected configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_QUESTION_BANK_BUCKET"
          test -n "$R2_PDF_PREVIEW_BUCKET"
          test "$R2_QUESTION_BANK_BUCKET" = "$R2_PDF_PREVIEW_BUCKET"
          test -n "$GOOGLE_SERVICE_ACCOUNT_EMAIL"
          test -n "$GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY"

      - name: Verify private R2 bucket access
        run: |
          node --input-type=module <<'NODE'
          import {
            headPrivateR2Bucket,
            listPrivateR2Objects,
          } from './scripts/r2-s3.mjs';

          const bucket = process.env.R2_QUESTION_BANK_BUCKET;
          await headPrivateR2Bucket({
            bucket,
            signal: AbortSignal.timeout(45_000),
          });
          const inventory = await listPrivateR2Objects({
            bucket,
            prefix: 'question-bank/assets/sha256/',
            signal: AbortSignal.timeout(60_000),
          });
          const base =
            process.env.R2_ENDPOINT?.trim() ||
            `https://${process.env.R2_ACCOUNT_ID}.r2.cloudflarestorage.com`;
          const unsignedUrl = new URL(
            `${base.replace(/\/+$/, '')}/${encodeURIComponent(bucket)}`,
          );
          const unsigned = await fetch(unsignedUrl, {
            method: 'HEAD',
            cache: 'no-store',
            signal: AbortSignal.timeout(30_000),
          });
          if (![400, 401, 403].includes(unsigned.status)) {
            throw new Error(
              `Unsigned R2 bucket endpoint did not fail closed: ${unsigned.status}`,
            );
          }
          console.log(
            `Private R2 preflight passed; first inventory page has ${inventory.objects.length} object(s), unsigned status ${unsigned.status}.`,
          );
          NODE

      - name: Run importer regression tests
        run: >-
          npx vitest run
          tests/exam-mate-importer.test.mjs
          tests/exam-mate-optimization-importer.test.mjs
          tests/exam-mate-production-recovery.test.mjs

      - name: Run TypeScript validation
        run: npm run typecheck

      - name: Download private staging files from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/staging"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { google } from 'googleapis';

          const root = process.env.ROOT;
          const files = {
            'ExamMate-audit-bundle-20260729-234339.zip': '196ro9mwcpUrNEV-7kcI-pYLl9o3JW7u2',
            'ExamMate-optimization-audit-20260730-153128.zip': '1Dt7c_Bm1y8Alst0tyTjIZkPyxmrN6bEX',
            'exam-mate-retained-pngs.tar.gz': '1mjCdYPbg9-Kk3JhLlQ0pq8Y2DXv7lcRH',
            'asset-parts-manifest.json': '11y6Tdx4uvZ5Xk3IDrswa9c-hhDadPC6p',
            'bas.part-00': '18t_7Qn0PmPJfOjzsydD0dqah7WrVOKLQ',
            'bas.part-01': '1cFrhzNpS_n9EBZRaOL7GR6tJNGWG1KAx',
            'bas.part-02': '1dsH52k90dWn8-yPHrR-PApED_vbYHnia',
            'bas.part-03': '1yTa1fVQzKhEQcV8t3anwjz7sx8-jJTfd',
            'sas.part-00': '19eZu-zOsPl3aNPPLDwiunoxlhKlvlhda',
            'sas.part-01': '1ZGIOC70rK4CTW_yD0II6X5L0I2jeQGBK',
            'sas.part-02': '15C7aZTLfpSIPoeR0Nqc-qmoOmTL5k0PH',
            'sas.part-03': '1Vnb2NcYMfUCrY3xYSomfGyCb_SJ0Ogbp',
            'sas.part-04': '1HfAY8ZdKDUezKGzVh0QpET4AVBfSeLkK',
          };
          let key = process.env.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY.trim();
          if ((key.startsWith('"') && key.endsWith('"')) || (key.startsWith("'") && key.endsWith("'"))) key = key.slice(1, -1);
          key = key.replace(/\\n/g, '\n').trim();
          const auth = new google.auth.JWT({
            email: process.env.GOOGLE_SERVICE_ACCOUNT_EMAIL,
            key,
            scopes: ['https://www.googleapis.com/auth/drive.readonly'],
          });
          const drive = google.drive({ version: 'v3', auth });
          for (const [name, id] of Object.entries(files)) {
            const target = path.join(root, 'staging', name);
            const response = await drive.files.get({ fileId: id, alt: 'media', supportsAllDrives: true }, { responseType: 'stream' });
            await new Promise((resolve, reject) => {
              const output = fs.createWriteStream(target, { flags: 'wx' });
              response.data.pipe(output);
              output.on('finish', resolve);
              output.on('error', reject);
              response.data.on('error', reject);
            });
            console.log(`Downloaded ${name}: ${fs.statSync(target).size} bytes`);
          }
          NODE

      - name: Verify split parts and reconstruct asset archives
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT/staging"
          echo '7e7755224001ed80da081ca44d09af495e6fd6c33dd03766a057cf24f719a564  asset-parts-manifest.json' | sha256sum -c -
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import path from 'node:path';
          const root = path.join(process.env.ROOT, 'staging');
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'asset-parts-manifest.json'), 'utf8'));
          for (const input of manifest.inputs) {
            for (const part of input.parts) {
              const file = path.join(root, part.name);
              const body = fs.readFileSync(file);
              const hash = crypto.createHash('sha256').update(body).digest('hex');
              if (body.byteLength !== part.size || hash !== part.sha256) {
                throw new Error(`Split part verification failed: ${part.name}`);
              }
            }
          }
          NODE
          cat bas.part-00 bas.part-01 bas.part-02 bas.part-03 > bas.zip
          cat sas.part-00 sas.part-01 sas.part-02 sas.part-03 sas.part-04 > sas.zip
          echo '0382233687c95632725d1507246e5c8289141f980f54dbd7441ddcaa2c2b4c39  bas.zip' | sha256sum -c -
          echo '17e6b30a4242b5065e755e92a036e4b6e1f2077b1ab60f27eddc992368b16f91  sas.zip' | sha256sum -c -
          echo '0ba6835f8046af116c589a6545af7f02d472e059cdb8488d7eb4fcd4dd65fa4f  ExamMate-audit-bundle-20260729-234339.zip' | sha256sum -c -
          echo 'e9f5ef0767d2404caabf6d8b328e7b16361cc308841fd964fa99b513b2f3a4b8  ExamMate-optimization-audit-20260730-153128.zip' | sha256sum -c -
          python3 - bas.zip sas.zip ExamMate-audit-bundle-20260729-234339.zip ExamMate-optimization-audit-20260730-153128.zip <<'PY'
          import pathlib
          import stat
          import sys
          import zipfile

          for raw in sys.argv[1:]:
            archive = pathlib.Path(raw)
            with zipfile.ZipFile(archive) as source:
              if source.testzip() is not None:
                raise SystemExit(f'ZIP integrity failed: {archive}')
              seen = set()
              for member in source.infolist():
                name = member.filename
                pure = pathlib.PurePosixPath(name)
                mode = member.external_attr >> 16
                entry_type = stat.S_IFMT(mode)
                if (
                  not name
                  or '\\' in name
                  or pure.is_absolute()
                  or '..' in pure.parts
                  or name in seen
                  or (mode and stat.S_ISLNK(mode))
                  or (
                    entry_type
                    and not stat.S_ISREG(mode)
                    and not stat.S_ISDIR(mode)
                  )
                  or member.flag_bits & 0x1
                ):
                  raise SystemExit(f'Unsafe ZIP member in {archive}: {name!r}')
                seen.add(name)
          PY
          unzip -tq bas.zip
          unzip -tq sas.zip
          mkdir -p "$ROOT/optimized-assets/sha256" "$ROOT/assets/sha256"
          python3 - bas.zip sas.zip "$ROOT/optimized-assets/sha256" <<'PY'
          import hashlib
          import pathlib
          import re
          import sys
          import zipfile

          archives = [pathlib.Path(value) for value in sys.argv[1:3]]
          destination_root = pathlib.Path(sys.argv[3])
          expected_count = 31328
          hash_name = re.compile(r'([0-9a-f]{64})\.webp')
          seen = set()
          ignored_metadata = []

          for archive in archives:
            archive_count = 0
            with zipfile.ZipFile(archive) as source:
              for member in source.infolist():
                if member.is_dir():
                  continue
                member_path = pathlib.PurePosixPath(member.filename)
                leaf = member_path.name.lower()
                if (
                  '__macosx' in {part.lower() for part in member_path.parts}
                  or leaf == '.ds_store'
                  or leaf.startswith('._')
                ):
                  ignored_metadata.append(f'{archive}:{member.filename}')
                  continue
                match = hash_name.fullmatch(leaf)
                if not match:
                  raise SystemExit(
                    f'Unexpected optimized asset member in {archive}: {member.filename!r}',
                  )
                expected_hash = match.group(1)
                if expected_hash in seen:
                  raise SystemExit(
                    f'Duplicate optimized asset hash across split archives: {expected_hash}',
                  )
                target = (
                  destination_root
                  / expected_hash[:2]
                  / f'{expected_hash}.webp'
                )
                target.parent.mkdir(parents=True, exist_ok=True)
                digest = hashlib.sha256()
                with source.open(member) as input_file, target.open('wb') as output_file:
                  while chunk := input_file.read(1024 * 1024):
                    digest.update(chunk)
                    output_file.write(chunk)
                actual_hash = digest.hexdigest()
                if actual_hash != expected_hash:
                  target.unlink(missing_ok=True)
                  raise SystemExit(
                    f'Optimized asset SHA-256 mismatch for {member.filename!r}: '
                    f'expected {expected_hash}, received {actual_hash}',
                  )
                seen.add(expected_hash)
                archive_count += 1
            print(f'Normalized {archive_count} verified WebP files from {archive}.')

          print(
            f'Ignored {len(ignored_metadata)} macOS metadata member(s): '
            + ', '.join(ignored_metadata),
          )
          if len(seen) != expected_count:
            raise SystemExit(
              f'Optimized WebP count mismatch: expected {expected_count}, received {len(seen)}',
            )
          staged = [
            path
            for path in destination_root.rglob('*')
            if path.is_file()
          ]
          if len(staged) != expected_count:
            raise SystemExit(
              f'Normalized staging count mismatch: expected {expected_count}, '
              f'received {len(staged)}',
            )
          print(f'Normalized and hash-verified {len(staged)} optimized WebP files.')
          PY

      - name: Prepare reviewed source capture layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/source-capture"
          unzip -q "$ROOT/staging/ExamMate-audit-bundle-20260729-234339.zip" -d "$ROOT/source-capture"
          test -f "$ROOT/source-capture/index/jobs.json"
          test ! -e "$ROOT/source-capture/source/discovered-jobs.json"
          cp "$ROOT/source-capture/index/jobs.json" "$ROOT/source-capture/source/discovered-jobs.json"
          test -f "$ROOT/source-capture/source/discovered-jobs.json"

      - name: Install and verify staged retained PNGs
        shell: bash
        run: |
          set -euo pipefail
          archive="$ROOT/staging/exam-mate-retained-pngs.tar.gz"
          echo '8f0aed7e069737d7e7c61ed599dc415e8fb8c583fdf17ad6c35360bdc1f87552  '"$archive" | sha256sum -c -
          test "$(file -b --mime-type "$archive")" = "application/gzip"
          python3 - "$archive" <<'PY'
          import pathlib
          import stat
          import sys
          import tarfile

          expected = {
            'assets/sha256/06/06ea097e54087326a75b01babb5e3894ed7e54e225ba84d657bb042569cebe46.png': 2583171,
            'assets/sha256/12/120c982865a8a7d71cb6c5f438ba4e7a70050c2091bd636fb4bda81a9b5531bd.png': 1255,
            'assets/sha256/36/36fc60ebfc9a5d561eb7ffcdc1edf660632c5e7ccd63ada77c7e7c5a89b5e82c.png': 1853,
            'assets/sha256/78/78f599c7ed82ee88047aec5471df1e727c3802b81f630c63978e0c95e9511c2b.png': 601454,
            'assets/sha256/84/846ac0a08c764d41ec2dff9209ac810e5bfab34d77a14015dd93e79d68b61957.png': 913,
            'assets/sha256/9b/9b126d902848af4f5d7d7a3f7261037287a72d28fc61a07691d3683da74bf764.png': 987,
            'assets/sha256/a4/a41449c35a3669f809d8c14b033949fafb4eec608e3d185716ae3bb4b480a7df.png': 1382,
            'assets/sha256/c9/c947caf8167543bf30976686f1d925ec43d1076ba02a64b1fc7d34a8f30e3b0b.png': 873,
          }
          seen = {}
          with tarfile.open(sys.argv[1], mode='r:gz') as source:
            for member in source.getmembers():
              pure = pathlib.PurePosixPath(member.name)
              name = str(pure)
              if (
                not member.name
                or '\\' in member.name
                or pure.is_absolute()
                or '..' in pure.parts
                or name in seen
                or member.issym()
                or member.islnk()
                or member.isdev()
              ):
                raise SystemExit(f'Unsafe retained-PNG member: {member.name!r}')
              if member.isdir():
                continue
              if not member.isfile():
                raise SystemExit(f'Unexpected retained-PNG member type: {member.name!r}')
              seen[name] = member.size
          if seen != expected:
            raise SystemExit(f'Retained-PNG archive manifest mismatch: {seen!r}')
          PY
          tar -xzf "$archive" -C "$ROOT"
          verify_png() {
            hash="$1"; bytes="$2"; file="$ROOT/assets/sha256/${hash:0:2}/$hash.png"
            test -f "$file"
            test "$(stat -c %s "$file")" -eq "$bytes"
            test "$(sha256sum "$file" | awk '{print $1}')" = "$hash"
          }
          verify_png 06ea097e54087326a75b01babb5e3894ed7e54e225ba84d657bb042569cebe46 2583171
          verify_png 120c982865a8a7d71cb6c5f438ba4e7a70050c2091bd636fb4bda81a9b5531bd 1255
          verify_png 36fc60ebfc9a5d561eb7ffcdc1edf660632c5e7ccd63ada77c7e7c5a89b5e82c 1853
          verify_png 78f599c7ed82ee88047aec5471df1e727c3802b81f630c63978e0c95e9511c2b 601454
          verify_png 846ac0a08c764d41ec2dff9209ac810e5bfab34d77a14015dd93e79d68b61957 913
          verify_png 9b126d902848af4f5d7d7a3f7261037287a72d28fc61a07691d3683da74bf764 987
          verify_png a41449c35a3669f809d8c14b033949fafb4eec608e3d185716ae3bb4b480a7df 1382
          verify_png c947caf8167543bf30976686f1d925ec43d1076ba02a64b1fc7d34a8f30e3b0b 873
          test "$(find "$ROOT/assets/sha256" -type f -name '*.png' | wc -l)" -eq 8

      - name: Verify complete staged optimization plan
        run: |
          node scripts/verify-exam-mate-staging.mjs \
            --optimization-audit "$ROOT/staging/ExamMate-optimization-audit-20260730-153128.zip" \
            --assets-root "$ROOT" \
            --report "$ROOT/staging-verification-report.json"

      - name: Run pinned offline audit
        run: |
          npm run question-bank:exam-mate -- \
            --archive "$ROOT/source-capture" \
            --optimization-audit "$ROOT/staging/ExamMate-optimization-audit-20260730-153128.zip" \
            --mode audit \
            --report "$ROOT/audit-report.json"

      - name: Run production-aware dry run
        run: |
          npm run question-bank:exam-mate -- \
            --archive "$ROOT/source-capture" \
            --optimization-audit "$ROOT/staging/ExamMate-optimization-audit-20260730-153128.zip" \
            --mode dry-run \
            --storage-bucket "$R2_PDF_PREVIEW_BUCKET" \
            --allow-shared-private-bucket \
            --resume-batch-id 27462015-2a25-41bf-93b0-c4efd24d9a3a \
            --report "$ROOT/dry-run-report.json"

      - name: Enforce dry-run production gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(`${process.env.ROOT}/dry-run-report.json`, 'utf8'));
          const expected = {
            sourceQuestions: 14199,
            importableQuestions: 14128,
            quarantinedQuestions: 71,
            assetManifestRows: 32198,
            uniquePhysicalAssets: 31336,
            importableAssetUrls: 32093,
            importablePhysicalAssets: 31231,
            resolvedQuestionSources: 14128,
            resolvedVariantSources: 14128,
            resolvedPhysicalAssets: 31231,
          };
          if (report.verificationStatus !== 'passed') throw new Error('Dry-run verification did not pass.');
          if (report.productionWritePerformed !== false) throw new Error('Dry-run unexpectedly performed a production write.');
          if ((report.findingsBySeverity?.critical || 0) !== 0) throw new Error('Dry-run contains critical findings.');
          if ((report.findingsBySeverity?.error || 0) !== 0) throw new Error('Dry-run contains error findings.');
          const pins = {
            sourceArchiveSha256:
              '0ba6835f8046af116c589a6545af7f02d472e059cdb8488d7eb4fcd4dd65fa4f',
            sourceChecksumsSha256:
              'ac4699532e92f6dd40ae79a89bc03b4b2556d2ab3030c766ba84bed70224d361',
            optimizationAuditSha256:
              'e9f5ef0767d2404caabf6d8b328e7b16361cc308841fd964fa99b513b2f3a4b8',
            optimizationChecksumsSha256:
              '3a7729dcf1cc7db10a1e57bcaa9df4fb7ffaa2e4e940e025efeee2b0d6f73883',
            optimizationPlanSha256:
              '4d43d7eeff8bfba65463d72d0d300482d52c0c5cf9df1e3dc7db10ec933f8b74',
            optimizationRowsSha256:
              'a04411148771050bde7e47f70de0fe2727b31db589a61265eddf57e0303ef67e',
          };
          for (const [key, value] of Object.entries(pins)) {
            if (report[key] !== value) throw new Error(`Dry-run pin mismatch for ${key}.`);
          }
          for (const [key, value] of Object.entries(expected)) {
            if (report.actualCounts?.[key] !== value) throw new Error(`Dry-run count mismatch for ${key}: ${report.actualCounts?.[key]} !== ${value}`);
          }
          const counts = report.actualCounts;
          if (
            counts.searchDocumentCandidates !== counts.importableQuestions ||
            counts.searchDocuments !== counts.uniqueVariantIds ||
            counts.searchDocumentsDeduplicated !==
              counts.searchDocumentCandidates - counts.searchDocuments ||
            counts.searchDocumentMateriallyDivergentGroups !== 0
          ) {
            throw new Error('Search-document normalization gate failed.');
          }
          for (const [collection, result] of Object.entries(
            counts.normalizedUniqueness || {},
          )) {
            if (result.duplicateKeys !== 0) {
              throw new Error(`${collection} retains duplicate conflict keys.`);
            }
          }
          const expectedRecoveryCounts = {
            newQuestionCores: 80,
            questionSources: 0,
            repairedQuestionSources: 80,
            variants: 80,
            repairedVariants: 282,
            variantSources: 0,
            repairedVariantSources: 80,
            placements: 80,
            papers: 77,
            assetSources: 0,
            repairedAssetSources: 199,
            variantAssets: 199,
            existingVariantAssets: 31894,
            recoveryDeletedVariantAssets: 199,
            recoveryDeletedVariantPapers: 305,
            recoveryDeletedCoursePapers: 2,
            recoveryDeletedPapers: 2,
          };
          for (const [key, value] of Object.entries(expectedRecoveryCounts)) {
            if (counts[key] !== value) {
              throw new Error(
                `Partial-import recovery count mismatch for ${key}: ${counts[key]} !== ${value}`,
              );
            }
          }
          if (
            counts.newAssetRows !== 0 ||
            counts.retargetedAssetRows !== 1 ||
            counts.assetUploadCandidates !== 31231
          ) {
            throw new Error('Partial asset recovery counts do not match the audited failed batch.');
          }
          console.log('Dry-run production gate passed.', report.actualCounts);
          NODE

      - name: Import database and selected private R2 assets
        run: |
          npm run question-bank:exam-mate -- \
            --archive "$ROOT/source-capture" \
            --optimization-audit "$ROOT/staging/ExamMate-optimization-audit-20260730-153128.zip" \
            --assets-root "$ROOT" \
            --mode all \
            --storage-bucket "$R2_PDF_PREVIEW_BUCKET" \
            --allow-shared-private-bucket \
            --workers 8 \
            --confirm-production \
            --resume-batch-id 27462015-2a25-41bf-93b0-c4efd24d9a3a \
            --report "$ROOT/import-report.json"

      - name: Enforce import verification gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(`${process.env.ROOT}/import-report.json`, 'utf8'));
          const verification = report.productionVerification;
          if (report.verificationStatus !== 'passed') throw new Error('Import normalization did not pass.');
          if (report.productionWritePerformed !== true) throw new Error('Import did not record a production write.');
          if ((report.assetUpload?.failed || 0) !== 0) throw new Error('One or more selected assets failed to upload.');
          if (verification?.status !== 'passed') throw new Error('Post-import verification did not pass.');
          if (verification.expectedQuestionSources !== 14128 || verification.questionSources !== 14128) throw new Error('Question-source verification count mismatch.');
          if (verification.verifiedSelectedAssets !== verification.expectedSelectedAssets) throw new Error('Selected asset verification count mismatch.');
          if (verification.missingQuestionSources?.length || verification.missingVariantSources?.length || verification.missingAssets?.length) throw new Error('Post-import verification reports missing records or assets.');
          for (const key of [
            'UniqueVariants',
            'Placements',
            'CoursePapers',
            'VariantPapers',
            'Papers',
            'AssetRows',
            'AssetSources',
            'VariantAssets',
            'SearchDocuments',
          ]) {
            const expected = verification[`expected${key}`];
            const actual = verification[
              `${key.charAt(0).toLowerCase()}${key.slice(1)}`
            ];
            if (!Number.isInteger(expected) || actual !== expected) {
              throw new Error(`${key} relationship verification mismatch.`);
            }
          }
          if (
            verification.duplicateSearchVariantIds !== 0 ||
            verification.unexpectedExamMateQuestionSourceRows !== 0 ||
            verification.unexpectedExamMateVariantSourceRows !== 0 ||
            verification.unexpectedExamMateSearchDocuments !== 0 ||
            verification.criticalImportFindings !== 0
          ) {
            throw new Error('Database uniqueness or provenance verification failed.');
          }
          if (
            report.assetUpload?.inventory?.expectedKeys !== 31231 ||
            report.assetUpload?.inventory?.missingExpectedKeys !== 0 ||
            report.assetUpload?.inventory?.unexpectedNewKeys !== 0 ||
            verification.r2ObjectsChecked !== 31231 ||
            verification.r2ObjectsVerified !== 31231 ||
            verification.r2ObjectsInvalid !== 0 ||
            verification.unusedOptimizationPlanAssets !== 105 ||
            verification.uploadedUnusedOptimizationPlanAssets !== 0
          ) {
            throw new Error('Private R2 inventory verification gate failed.');
          }
          console.log('Import verification gate passed.', verification);
          NODE

      - name: Run independent post-import verification
        run: |
          npm run question-bank:exam-mate -- \
            --archive "$ROOT/source-capture" \
            --optimization-audit "$ROOT/staging/ExamMate-optimization-audit-20260730-153128.zip" \
            --mode verify \
            --storage-bucket "$R2_PDF_PREVIEW_BUCKET" \
            --allow-shared-private-bucket \
            --report "$ROOT/verify-report.json"

      - name: Enforce independent verification gate
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(`${process.env.ROOT}/verify-report.json`, 'utf8'));
          const verification = report.productionVerification;
          if (report.productionWritePerformed !== false) throw new Error('Independent verification unexpectedly wrote to production.');
          if (verification?.status !== 'passed') throw new Error('Independent production verification failed.');
          if (verification.questionSources !== 14128 || verification.expectedQuestionSources !== 14128) throw new Error('Independent question-source verification mismatch.');
          if (verification.verifiedSelectedAssets !== verification.expectedSelectedAssets) throw new Error('Independent selected-asset verification mismatch.');
          if (verification.missingQuestionSources?.length || verification.missingVariantSources?.length || verification.missingAssets?.length) throw new Error('Independent verification reports missing records or assets.');
          for (const key of [
            'UniqueVariants',
            'Placements',
            'CoursePapers',
            'VariantPapers',
            'Papers',
            'AssetRows',
            'AssetSources',
            'VariantAssets',
            'SearchDocuments',
          ]) {
            const expected = verification[`expected${key}`];
            const actual = verification[
              `${key.charAt(0).toLowerCase()}${key.slice(1)}`
            ];
            if (!Number.isInteger(expected) || actual !== expected) {
              throw new Error(`Independent ${key} verification mismatch.`);
            }
          }
          if (
            verification.duplicateSearchVariantIds !== 0 ||
            verification.unexpectedExamMateQuestionSourceRows !== 0 ||
            verification.unexpectedExamMateVariantSourceRows !== 0 ||
            verification.unexpectedExamMateSearchDocuments !== 0 ||
            verification.criticalImportFindings !== 0
          ) {
            throw new Error('Independent database uniqueness or provenance verification failed.');
          }
          if (
            verification.r2ObjectsChecked !== 31231 ||
            verification.r2ObjectsVerified !== 31231 ||
            verification.r2ObjectsInvalid !== 0 ||
            verification.unusedOptimizationPlanAssets !== 105 ||
            verification.uploadedUnusedOptimizationPlanAssets !== 0
          ) {
            throw new Error('Independent private R2 inventory verification failed.');
          }
          console.log('Independent verification gate passed.', verification);
          NODE

      - name: Upload immutable audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exam-mate-production-reports-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ExamMate-index-20260729-223333/*-report.json
          if-no-files-found: warn
          retention-days: 3

      - name: Secure runner cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$ROOT"
