name: Fix tutorial effect deps

on:
  push:
    branches:
      - fix/light-mode-builder-tutorial-polish

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[tutorial-effect-deps]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/light-mode-builder-tutorial-polish
          fetch-depth: 0
      - run: python3 scripts/tmp-fix-tutorial-effect-deps.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/tutorial/tutorial-controller.tsx
          git commit -m "Fix tutorial route handoff dependencies [tutorial-effect-deps]"
          git push origin HEAD:fix/light-mode-builder-tutorial-polish
