name: Finalize remote Question Bank assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-remote-question-bank-assets.yml"

permissions:
  contents: read

concurrency:
  group: finalize-remote-question-bank-assets
  cancel-in-progress: false

jobs:
  finalize:
    name: Internalize and compress remote Question Bank assets
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_QUESTION_BANK_BUCKET: ${{ secrets.R2_QUESTION_BANK_BUCKET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production storage configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$R2_QUESTION_BANK_BUCKET"
          test -n "$R2_ACCOUNT_ID" || test -n "$R2_ENDPOINT"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"

      - name: Internalize and compress all staged remote assets
        run: |
          node scripts/finalize-remote-question-bank-assets.mjs             --confirm-production             --workers 6             --report .question-bank-reports/remote-asset-finalize.json

      - name: Upload finalization report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remote-question-bank-asset-finalize-${{ github.run_id }}
          path: .question-bank-reports/remote-asset-finalize.json
          if-no-files-found: warn
          retention-days: 30
