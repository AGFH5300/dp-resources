name: Fix complete release copy

on:
  push:
    branches:
      - release/full-post-production-audit-20260916

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[release-copy-fixed-20260916]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/full-post-production-audit-20260916
          fetch-depth: 0
      - run: python3 scripts/tmp-release-copy-fix-20260916.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/changelog/page.tsx lib/changelog.ts
          git commit -m "Fix public release copy [release-copy-fixed-20260916]"
          git push origin HEAD:release/full-post-production-audit-20260916
