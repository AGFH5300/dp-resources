name: Trigger Exam-Mate recovery read-only audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-exam-mate-production-import.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: exam-mate-recovery-audit-trigger
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch guarded read-only audit
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch merged-main recovery audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          gh workflow run exam-mate-recovery-audit.yml \
            --repo AGFH5300/dp-resources \
            --ref main \
            -f confirmation=RUN-EXAM-MATE-READ-ONLY-AUDIT
          echo 'Guarded Exam-Mate read-only recovery audit dispatched.'
