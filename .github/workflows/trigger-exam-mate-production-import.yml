name: Inspect Exam-Mate production import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-exam-mate-production-import.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print current Exam-Mate workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list \
            --repo AGFH5300/dp-resources \
            --workflow exam-mate-production-import.yml \
            --limit 10 \
            --json databaseId,status,conclusion,headSha,event,createdAt,updatedAt,url,displayTitle,workflowName
          echo 'Corrected-import monitor.'
          exit 1
