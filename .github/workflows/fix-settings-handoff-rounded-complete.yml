name: Fix settings handoff rounded complete

on:
  push:
    branches:
      - fix/tutorial-settings-handoff-rounded-complete

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[settings-handoff-rounded]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tutorial-settings-handoff-rounded-complete
          fetch-depth: 0
      - run: python3 scripts/tmp-fix-settings-handoff-rounded-complete.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/question-bank/practice-set-builder-v2.module.css components/tutorial/tutorial-controller.tsx tests/tutorial-onboarding.test.ts tests/light-mode-builder-tutorial-polish.test.ts
          git commit -m "Fix tutorial Settings handoff and completed subject clipping [settings-handoff-rounded]"
          git push origin HEAD:fix/tutorial-settings-handoff-rounded-complete
