name: Light mode builder tutorial polish

on:
  push:
    branches:
      - fix/light-mode-builder-tutorial-polish

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[light-builder-polish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/light-mode-builder-tutorial-polish
          fetch-depth: 0
      - name: Apply UI polish patch
        run: python3 scripts/tmp-light-mode-builder-tutorial-polish.py
      - name: Commit UI polish
        run: |
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/question-bank/practice-set-builder-v4.tsx components/question-bank/practice-set-builder-v2.module.css components/tutorial/tutorial-controller.tsx tests/light-mode-builder-tutorial-polish.test.ts
          git commit -m "Polish Practice Builder light mode and tutorial spotlight [light-builder-polish]"
          git push origin HEAD:fix/light-mode-builder-tutorial-polish
