name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply guarded Question Bank blocker patch
        if: github.head_ref == 'fix/question-bank-session-blockers' && hashFiles('scripts/apply-question-bank-session-blockers.mjs') != ''
        run: node scripts/apply-question-bank-session-blockers.mjs
      - name: Commit guarded patch to the pull-request branch
        if: github.head_ref == 'fix/question-bank-session-blockers' && hashFiles('scripts/apply-question-bank-session-blockers.mjs') == ''
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Question Bank session creation blockers"
          git push origin HEAD:fix/question-bank-session-blockers
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
