name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Diagnose tests file-by-file
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "::group::Vitest $file"
            timeout --signal=TERM --kill-after=5s 30s npx vitest run "$file" --no-file-parallelism --reporter=verbose
            echo "::endgroup::"
          done < <(find tests -maxdepth 1 -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.test.mjs' \) | sort)
      - run: npm run lint
      - run: npm run build
      - run: npm run security:client-bundle
      - run: npm audit --omit=dev --audit-level=high
