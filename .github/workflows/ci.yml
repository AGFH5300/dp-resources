name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run tests
        run: npm test -- --no-file-parallelism --reporter=verbose
        timeout-minutes: 5
      - run: npm run lint
      - run: npm run build
      - run: npm run security:client-bundle
      - run: npm audit --omit=dev --audit-level=high
