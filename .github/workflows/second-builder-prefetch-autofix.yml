name: Second builder prefetch autofix

on:
  push:
    branches:
      - fix/question-bank-prefetch-timeouts

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[second-builder-prefetch-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/question-bank-prefetch-timeouts
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/tmp-disable-second-builder-prefetch.py
      - name: Save patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/question-bank/page.tsx
          git diff --cached --quiet || git commit -m "Disable secondary Practice Builder prefetch [second-builder-prefetch-fix]"
          git push origin HEAD:fix/question-bank-prefetch-timeouts
