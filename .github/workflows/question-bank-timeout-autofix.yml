name: Question Bank timeout autofix

on:
  push:
    branches:
      - fix/question-bank-prefetch-timeouts

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[question-bank-timeout-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/question-bank-prefetch-timeouts
          fetch-depth: 0
      - name: Apply Question Bank timeout hardening
        run: python3 scripts/tmp-fix-question-bank-timeouts.py
      - name: Commit Question Bank timeout hardening
        run: |
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/tutorial/tutorial-controller.tsx app/question-bank/page.tsx app/question-bank/build/page.tsx lib/question-bank/course-counts.ts tests/tutorial-onboarding.test.ts tests/question-bank-timeout-resilience.test.ts supabase/migrations/20260915183000_question_bank_source_count_timeout_hardening.sql
          git commit -m "Harden Question Bank against prefetch and count timeouts [question-bank-timeout-fix]"
          git push origin HEAD:fix/question-bank-prefetch-timeouts
