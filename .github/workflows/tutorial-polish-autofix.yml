name: Tutorial polish autofix

on:
  push:
    branches:
      - fix/tutorial-source-position-and-resource-library

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[tutorial-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tutorial-source-position-and-resource-library
          fetch-depth: 0
      - name: Apply tutorial polish
        run: python3 scripts/tmp-tutorial-polish.py
      - name: Commit tutorial polish
        run: |
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/tutorial/tutorial-controller.tsx app/library/instant-library-browser.tsx tests/tutorial-onboarding.test.ts
          git commit -m "Stabilize IB tutorial target and source positioning [tutorial-autofix]"
          git push origin HEAD:fix/tutorial-source-position-and-resource-library
