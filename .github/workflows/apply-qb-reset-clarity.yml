name: Apply reset clarity patch

on:
  push:
    branches:
      - fix/qb-reset-selection-clarity-changelog
    paths:
      - .github/workflows/apply-qb-reset-clarity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qb-reset-selection-clarity-changelog
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node .github/scripts/apply-qb-reset-clarity.mjs
