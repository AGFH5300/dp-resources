name: Refresh 16 September release notes

on:
  push:
    branches:
      - release/refresh-notes-20260916

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[release-notes-20260916]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/refresh-notes-20260916
          fetch-depth: 0
      - run: python3 scripts/tmp-refresh-release-notes-20260916.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/whats-new.ts app/changelog/page.tsx lib/changelog.ts tests/source-ui-and-whats-new.test.ts tests/account-settings.test.ts tests/admin-private-aliases-and-question-bank-activity.test.ts
          git commit -m "Refresh 16 September public release notes [release-notes-20260916]"
          git push origin HEAD:release/refresh-notes-20260916
