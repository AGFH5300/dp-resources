name: Dispatch guarded Exam-Mate production upload
# One-time retry after correcting the pinned retained BMP MIME type.

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-exam-mate-production-upload.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch reviewed one-time importer
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch guarded production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run exam-mate-production-import.yml \
            --repo AGFH5300/dp-resources \
            --ref main \
            -f confirmation=RESUME-EXAM-MATE-PRODUCTION-IMPORT
