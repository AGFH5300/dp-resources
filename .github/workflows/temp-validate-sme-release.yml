name: Validate SME release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-validate-sme-release.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run affected tests
        run: npx vitest run tests/admin-activity-user-links.test.ts tests/source-ui-and-whats-new.test.ts tests/whats-new-release-structure.test.ts
      - name: Lint affected files
        run: npx eslint app/api/admin/users/activity-detail/route.ts components/admin/activity-user-links.tsx components/whats-new/whats-new-media.tsx lib/whats-new.ts app/changelog/page.tsx lib/changelog.ts tests/admin-activity-user-links.test.ts tests/source-ui-and-whats-new.test.ts tests/whats-new-release-structure.test.ts
      - run: npm run build
      - run: npm run security:client-bundle
      - run: npm audit --omit=dev --audit-level=high
      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name "dp-resources-validation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-validate-sme-release.yml
          git commit -m "chore: remove temporary SME release validation"
          git push origin main
