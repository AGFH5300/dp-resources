name: Apply admin PDF and recent-question fixes

on:
  push:
    branches: [fix/admin-pdf-recent-questions]
    paths:
      - scripts/apply-admin-pdf-recent-fixes.mjs
      - .github/workflows/apply-admin-pdf-recent-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-pdf-recent-questions
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-admin-pdf-recent-fixes.mjs
      - name: Commit applied fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/drive-utils.ts app/admin/question-bank/page.tsx components/question-bank/question-state-controls.tsx app/api/question-bank/questions/[variantId]/route.ts app/recent/page.tsx tests/admin-pdf-recent-regressions.test.ts
          git commit -m "Fix admin contrast, Unicode PDF headers, and recent questions"
          git push origin HEAD:fix/admin-pdf-recent-questions
