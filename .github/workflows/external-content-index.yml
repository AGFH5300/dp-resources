name: External DP Content Index

on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/external-content-indexer.mjs'
      - 'scripts/revision-dojo-indexer.mjs'
      - '.github/workflows/external-content-index.yml'

permissions:
  contents: write

concurrency:
  group: external-dp-content-index
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'

      - name: Syntax check
        run: |
          node --check scripts/external-content-indexer.mjs
          node --check scripts/revision-dojo-indexer.mjs

      - name: Scan all monitored DP sources
        run: >-
          node scripts/external-content-indexer.mjs
          --mode scan
          --write-state
          --report audits/external-content-delta-latest.json
          --state audits/external-content-index-state.json

      - name: Scan RevisionDojo catalog
        run: >-
          node scripts/revision-dojo-indexer.mjs
          --write-state
          --report audits/revision-dojo-delta-latest.json
          --state audits/revision-dojo-index-state.json

      - name: Persist metadata index and delta
        run: |
          if [ -z "$(git status --porcelain -- audits/external-content-index-state.json audits/external-content-delta-latest.json audits/revision-dojo-index-state.json audits/revision-dojo-delta-latest.json)" ]; then
            echo 'No index changes to commit.'
            exit 0
          fi
          git config user.name 'dp-resources-content-indexer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            audits/external-content-index-state.json \
            audits/external-content-delta-latest.json \
            audits/revision-dojo-index-state.json \
            audits/revision-dojo-delta-latest.json
          git commit -m 'chore: refresh external DP content index [skip ci]'
          git push origin HEAD:main
