name: Apply Exam-Mate importer correction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'fix/exam-mate-archive-and-reference-parser' && !contains(github.event.pull_request.head.sha, '0000000')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/exam-mate-archive-and-reference-parser
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply exact reviewed corrections
        shell: python
        run: |
          from pathlib import Path

          source = Path('scripts/question-bank/exam-mate.mjs')
          text = source.read_text()
          old_paper = """function paperParts(parts) {
            const raw = String(parts?.sourcePaperCode || '');
            const digits = raw.match(/(\\d)(\\d)$/);
            if (!digits) return null;
            return {
              paper: digits[1],
              timezone: digits[2],
            };
          }"""
          new_paper = """function paperParts(parts) {
            const raw = String(parts?.sourcePaperCode || '').trim();
            const digits = raw.match(/^(\\d)(\\d)$/);
            const legacyMathematicsOption = raw.match(/^(\\d)\\s+.+?(\\d)$/i);
            const singlePaperWithoutTimezone = raw.match(/^(\\d)$/);
            const match = digits || legacyMathematicsOption || singlePaperWithoutTimezone;
            if (!match) return null;
            return {
              paper: match[1],
              timezone: match[2] || '0',
            };
          }"""
          if old_paper not in text:
            raise SystemExit('Expected paperParts source was not found; refusing an ambiguous patch.')
          text = text.replace(old_paper, new_paper, 1)
          text = text.replace("'source/discovered-jobs.json',", "'index/jobs.json',", 1)
          text = text.replace("readFile(path.join(root, 'source', 'discovered-jobs.json'), 'utf8').then(JSON.parse),", "readFile(path.join(root, 'index', 'jobs.json'), 'utf8').then(JSON.parse),", 1)
          source.write_text(text)

          tests = Path('tests/exam-mate-importer.test.mjs')
          test_text = tests.read_text()
          marker = "  it('keeps old Mathematics tracks separate from AA and AI', () => {"
          additions = """  it('parses legacy Mathematics option references without quarantining them', () => {
            expect(
              canonicalExamKey('Mathematics', {
                reference: 'MAT/3 Statistics0_HL_Winter_2013_Q3',
              }),
            ).toBe('mathematics|13|N|3|HL|TZ0|3');
          });

          it('parses Further Mathematics papers that omit a timezone digit', () => {
            expect(
              canonicalExamKey('Further Mathematics', {
                reference: 'FURMA/1_HL_Summer_2018_Q1',
              }),
            ).toBe('further-mathematics|18|M|1|HL|TZ0|1');
          });

          """
          if marker not in test_text:
            raise SystemExit('Expected test insertion marker was not found.')
          test_text = test_text.replace(marker, additions + marker, 1)
          tests.write_text(test_text)

      - run: npm ci
      - run: node --check scripts/question-bank/exam-mate.mjs
      - run: npx vitest run tests/exam-mate-importer.test.mjs
      - name: Commit tested fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-exam-mate-importer-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/question-bank/exam-mate.mjs tests/exam-mate-importer.test.mjs .github/workflows/apply-exam-mate-importer-fix.yml
          git commit -m 'Fix Exam-Mate archive layout and legacy references'
          git push origin HEAD:fix/exam-mate-archive-and-reference-parser
