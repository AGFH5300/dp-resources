name: Dependency lock refresh

on:
  push:
    branches:
      - feature/settings-account-centre
    paths:
      - .github/workflows/dependency-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feature/settings-account-centre
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Refresh lockfile to patched compatible versions
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --omit=dev --ignore-scripts
      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh audited dependency lockfile"
          git push origin HEAD:feature/settings-account-centre
