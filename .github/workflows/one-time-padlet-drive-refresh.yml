name: One-time Padlet Drive refresh

on:
  push:
    branches:
      - agent/padlet-drive-refresh-20260811
    paths:
      - .github/workflows/one-time-padlet-drive-refresh.yml
      - scripts/one-time-padlet-drive-refresh.mjs

permissions:
  contents: read

concurrency:
  group: one-time-padlet-drive-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify required credentials
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$GOOGLE_SERVICE_ACCOUNT_EMAIL"
          test -n "$GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY"

      - name: Refresh Padlet Drive files and Library metadata
        run: node scripts/one-time-padlet-drive-refresh.mjs

      - name: Upload verification summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: padlet-drive-refresh-summary
          path: padlet-refresh-summary.json
          if-no-files-found: ignore
          retention-days: 14

