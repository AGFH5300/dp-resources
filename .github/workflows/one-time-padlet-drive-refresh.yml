name: One-time Padlet Drive refresh

on:
  push:
    branches:
      - agent/padlet-drive-refresh-20260811
    paths:
      - .github/workflows/one-time-padlet-drive-refresh.yml
      - scripts/one-time-padlet-drive-refresh.mjs
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-time-padlet-drive-refresh.yml
      - scripts/one-time-padlet-drive-refresh.mjs

permissions:
  contents: write

concurrency:
  group: one-time-padlet-drive-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify required credentials
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$GOOGLE_SERVICE_ACCOUNT_EMAIL"
          test -n "$GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY"

      - name: Refresh Padlet Drive files and Library metadata
        run: node scripts/one-time-padlet-drive-refresh.mjs

      - name: Upload verification summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: padlet-drive-refresh-summary
          path: padlet-refresh-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Record verification summary on the maintenance branch
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          test -f padlet-refresh-summary.json || exit 0
          mkdir -p ops
          cp padlet-refresh-summary.json ops/padlet-drive-refresh-summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/padlet-drive-refresh-summary.json
          git diff --cached --quiet && exit 0
          git commit -m "Record Padlet Drive refresh result"
          git push
