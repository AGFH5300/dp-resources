name: Apply Question Bank production rendering fix

on:
  push:
    paths:
      - '.github/workflows/apply-qb-production-render-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply exact production rendering fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'lib/question-bank/interactive.ts',
              """export type InteractiveQuestion = {
            prompt: string;
            choices: InteractiveChoice[];
          """,
              """export type InteractiveQuestion = {
            prompt: string;
            promptBeforeChoices: string;
            promptAfterChoices: string;
            choices: InteractiveChoice[];
          """,
          )

          replace_once(
              'lib/question-bank/interactive.ts',
              """  return {
              prompt,
              choices: [],
          """,
              """  return {
              prompt,
              promptBeforeChoices: prompt,
              promptAfterChoices: '',
              choices: [],
          """,
          )

          replace_once(
              'lib/question-bank/interactive.ts',
              """  const prompt = [...lines.slice(0, block.start), ...lines.slice(block.end)]
              .join('\\n')
              .replace(/\\n{3,}/g, '\\n\\n')
              .trim();
          """,
              """  const promptBeforeChoices = lines
              .slice(0, block.start)
              .join('\\n')
              .replace(/\\n{3,}/g, '\\n\\n')
              .trim();
            const promptAfterChoices = lines
              .slice(block.end)
              .join('\\n')
              .replace(/\\n{3,}/g, '\\n\\n')
              .trim();
            const prompt = [promptBeforeChoices, promptAfterChoices]
              .filter(Boolean)
              .join('\\n\\n');
          """,
          )

          replace_once(
              'lib/question-bank/interactive.ts',
              """  return {
              prompt,
              choices: block.choices,
          """,
              """  return {
              prompt,
              promptBeforeChoices,
              promptAfterChoices,
              choices: block.choices,
          """,
          )

          replace_once(
              'lib/question-bank/content-normalization.ts',
              """      .join('\\n')
              .replace(STYLE_ATTRIBUTE, '')
          """,
              r"""      .join('\n')
              .replace(
                /\$\s*\\answer\s*\{\s*\\textrm\s*\{([^{}]*)\}\s*\}\s*\$/gi,
                ':answer[$1]',
              )
              .replace(/\$\s*\\answer\s*\{([^{}]*)\}\s*\$/gi, ':answer[$1]')
              .replace(
                /\\answer\s*\{\s*\\textrm\s*\{([^{}]*)\}\s*\}/gi,
                ':answer[$1]',
              )
              .replace(/\\answer\s*\{([^{}]*)\}/gi, ':answer[$1]')
              .replace(
                /\$\s*\\text\s*\{\s*\\textquotedblleft\s*\}\s*\$/gi,
                '“',
              )
              .replace(/\\text\s*\{\s*\\textquotedblleft\s*\}/gi, '“')
              .replace(/\$\s*(\d+)\s*-\s*(\d+)\.\s*\$/g, '$1–$2.')
              .replace(/\$\s*(\d+)\.\s*\$/g, '$1.')
              .replace(STYLE_ATTRIBUTE, '')
          """,
          )

          replace_once(
              'components/question-bank/question-content.tsx',
              """type RendererProps = {
            source: string;
            assets?: QuestionAsset[];
            kind?: 'question' | 'markscheme';
          };
          """,
              """type RendererProps = {
            source: string;
            assets?: QuestionAsset[];
            kind?: 'question' | 'markscheme';
            renderUnreferencedAudio?: boolean;
          };
          """,
          )

          replace_once(
              'components/question-bank/question-content.tsx',
              """  if (name === 'marks')
              return (
                <span key={key} className="dp-qb-marks">
                  {children}
                </span>
              );
          """,
              """  if (name === 'marks') {
              const count = Number(content.trim());
              return (
                <span key={key} className="dp-qb-marks">
                  {Number.isFinite(count) && count >= 0
                    ? `${count} mark${count === 1 ? '' : 's'}`
                    : children}
                </span>
              );
            }
          """,
          )

          replace_once(
              'components/question-bank/question-content.tsx',
              """function audioCard(asset: QuestionAsset, key: string, label?: string) {
            const transcript = cleanTranscript(asset.audio?.transcript || '');
            const duration = durationLabel(asset.audio?.durationSeconds);
            return (
              <section
                key={key}
                className="my-4 rounded-xl border border-slate-200 bg-slate-50 p-4 text-left"
                aria-label={label || asset.altText || 'Listening material'}
              >
          """,
              """function audioCard(asset: QuestionAsset, key: string, label?: string) {
            const transcript = cleanTranscript(asset.audio?.transcript || '');
            const duration = durationLabel(asset.audio?.durationSeconds);
            const safeLabel = label || 'Question audio';
            return (
              <section
                key={key}
                className="my-4 rounded-xl border border-slate-200 bg-slate-50 p-4 text-left"
                aria-label={safeLabel}
              >
          """,
          )

          replace_once(
              'components/question-bank/question-content.tsx',
              """          <p className="text-sm font-medium text-slate-800">
                    {label || asset.altText || 'Question audio'}
                  </p>
          """,
              """          <p className="text-sm font-medium text-slate-800">{safeLabel}</p>
          """,
          )

          replace_once(
              'components/question-bank/question-content.tsx',
              """        aria-label={label || asset.altText || 'Question audio'}
          """,
              """        aria-label={safeLabel}
          """,
          )

          replace_once(
              'components/question-bank/question-content.tsx',
              """export function QuestionContent({
            source,
            assets = [],
            kind = 'question',
          }: RendererProps) {
            const normalizedSource = normalizeQuestionSource(source);
            const fallbackAudio = fallbackAudioBlocks(normalizedSource, assets);
          """,
              """export function QuestionContent({
            source,
            assets = [],
            kind = 'question',
            renderUnreferencedAudio = true,
          }: RendererProps) {
            const normalizedSource = normalizeQuestionSource(source);
            const fallbackAudio =
              kind === 'question' && renderUnreferencedAudio
                ? fallbackAudioBlocks(normalizedSource, assets)
                : null;
          """,
          )

          replace_once(
              'components/question-bank/course-practice-workspace.tsx',
              """                <QuestionContent
                  source={interactive.prompt || detail.question.content}
                  assets={questionAssets}
                />
          """,
              """                <QuestionContent
                  source={
                    interactive.choices.length
                      ? interactive.promptBeforeChoices
                      : interactive.prompt || detail.question.content
                  }
                  assets={questionAssets}
                />
          """,
          )

          replace_once(
              'components/question-bank/course-practice-workspace.tsx',
              """                            <QuestionContent
                              source={choice.source}
                              assets={questionAssets}
                            />
          """,
              """                            <QuestionContent
                              source={choice.source}
                              assets={questionAssets}
                              renderUnreferencedAudio={false}
                            />
          """,
          )

          replace_once(
              'components/question-bank/course-practice-workspace.tsx',
              """                    </button>
                  </>
                ) : (
          """,
              """                    </button>
                    {interactive.promptAfterChoices ? (
                      <div className="mt-6 border-t border-slate-200 pt-5">
                        <QuestionContent
                          source={interactive.promptAfterChoices}
                          assets={questionAssets}
                          renderUnreferencedAudio={false}
                        />
                      </div>
                    ) : null}
                  </>
                ) : (
          """,
          )

          test_path = Path('tests/question-bank-production-rendering.test.tsx')
          test_path.write_text(r"""import React from 'react';
          import { renderToStaticMarkup } from 'react-dom/server';
          import { describe, expect, it } from 'vitest';

          import { QuestionContent } from '@/components/question-bank/question-content';
          import { normalizeQuestionSource } from '@/lib/question-bank/content-normalization';
          import { parseInteractiveQuestion } from '@/lib/question-bank/interactive';
          import type { QuestionAsset } from '@/lib/question-bank/types';

          const audioSourceId = 'b7f46048-e474-4409-8b14-990a5af65d71';
          const questionId = '2e3a6b32-0ef7-4d9e-96b7-c9c70c2a5af0';
          const audioAsset: QuestionAsset = {
            id: 'ddbffa21-82d7-5ea9-9826-e4058eb4c965',
            sourceFileId: audioSourceId,
            role: 'content_reference',
            originalRole: 'audio',
            sortOrder: 0,
            altText: `${questionId}:${audioSourceId}`,
            contentType: 'audio/mp4',
            audio: {
              provider: 'revision-village',
              sourceAudioId: audioSourceId,
              transcriptId: null,
              transcript: ':u[Transcript]\n\nThe shift began quietly.',
              durationSeconds: 64.021,
            },
          };

          const content = String.raw`**You are going to hear a nurse talking to a friend.**

          :audio{#${audioSourceId} aid="${audioSourceId}"}

          **Choose the three true statements.** :marks[3]
          ::indent
          - A. First answer.
          - B. Second answer.
          - C. Third answer.
          - D. Fourth answer.
          - E. Fifth answer.
          - F. Sixth answer.

          **Answer the following questions.**

          $4.$ What was the intern learning to do? :marks[1]

          $5.$ How does the nurse describe themselves? :marks[1]`;

          describe('production Question Bank rendering', () => {
            it('keeps the interactive choices at their source position', () => {
              const parsed = parseInteractiveQuestion(
                content,
                String.raw`$1 - 3.$ $\answer{\textrm{A, C, F}}$ :marks[3]`,
                5,
              );
              expect(parsed.promptBeforeChoices).toContain('Choose the three true statements');
              expect(parsed.promptBeforeChoices).not.toContain('Answer the following questions');
              expect(parsed.promptAfterChoices).toContain('Answer the following questions');
              expect(parsed.promptAfterChoices).toContain('4. What was the intern');
              expect(parsed.correctChoiceIds).toEqual(['A', 'C', 'F']);
            });

            it('never exposes source UUID labels and renders audio only where requested', () => {
              const question = renderToStaticMarkup(
                <QuestionContent source={content} assets={[audioAsset]} />,
              );
              const choice = renderToStaticMarkup(
                <QuestionContent
                  source="First answer."
                  assets={[audioAsset]}
                  renderUnreferencedAudio={false}
                />,
              );
              expect(question.match(/<audio/g)).toHaveLength(1);
              expect(question).not.toContain(`${questionId}:${audioSourceId}`);
              expect(question).not.toContain(audioSourceId);
              expect(question).toContain('Question audio');
              expect(choice).not.toContain('<audio');
              expect(choice).not.toContain('Listening material');
            });

            it('cleans imported answer, quote, number and mark notation', () => {
              const source = String.raw`$1 - 3.$ $\answer{\textrm{ A, C, F}}$ :marks[3]

          $\text{\textquotedblleft}$No supervisor — just me”

          $4.$ $\answer{\textrm{enter data}}$ :marks[1]`;
              const normalized = normalizeQuestionSource(source);
              const output = renderToStaticMarkup(
                <QuestionContent kind="markscheme" source={source} assets={[audioAsset]} />,
              );
              expect(normalized).toContain('1–3. :answer[ A, C, F]');
              expect(normalized).toContain('“No supervisor');
              expect(normalized).toContain('4. :answer[enter data]');
              expect(output).not.toContain('\\answer');
              expect(output).not.toContain('textquotedblleft');
              expect(output).not.toContain('<audio');
              expect(output).toContain('3 marks');
              expect(output).toContain('1 mark');
            });
          });
          """)
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'dp-resources-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            lib/question-bank/interactive.ts \
            lib/question-bank/content-normalization.ts \
            components/question-bank/question-content.tsx \
            components/question-bank/course-practice-workspace.tsx \
            tests/question-bank-production-rendering.test.tsx
          git commit -m 'Fix Question Bank production rendering layout'
          git push origin HEAD:${GITHUB_REF_NAME}
