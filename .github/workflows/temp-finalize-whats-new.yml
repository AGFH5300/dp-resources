name: Finalize Whats New release notes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update release copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old_changelog = "Redesigned What’s New into a release-aware, feature-by-feature product presentation with visual media, swipe, keyboard and progress navigation, deep-link actions, polished video controls, release history, development previewing, and cross-device viewed-state persistence."
          new_changelog = "Redesigned What’s New into a polished feature-by-feature update experience with responsive slides, swipe, keyboard and progress navigation, Try it shortcuts, release history, and viewed-state syncing across devices."

          for filename in ["lib/changelog.ts", "app/changelog/page.tsx"]:
              path = Path(filename)
              text = path.read_text()
              if old_changelog not in text:
                  raise SystemExit(f"Expected changelog copy not found in {filename}")
              path.write_text(text.replace(old_changelog, new_changelog))

          path = Path("lib/whats-new.ts")
          text = path.read_text()
          old_summary = "A major Question Bank expansion, broader Physics coverage, guided onboarding and a steadier practice experience."
          new_summary = "A major Question Bank expansion, broader Physics coverage, guided onboarding, steadier practice and a redesigned way to discover every major DP Resources update."
          if old_summary not in text:
              raise SystemExit("Expected What’s New summary not found")
          path.write_text(text.replace(old_summary, new_summary))

          path = Path("tests/whats-new-release-structure.test.ts")
          text = path.read_text()
          old_test = "Redesigned What’s New into a release-aware, feature-by-feature product presentation"
          new_test = "Redesigned What’s New into a polished feature-by-feature update experience"
          if old_test not in text:
              raise SystemExit("Expected changelog test copy not found")
          path.write_text(text.replace(old_test, new_test))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/source-ui-and-whats-new.test.ts tests/whats-new-release-structure.test.ts

      - name: Commit final release copy
        shell: bash
        run: |
          git rm .github/workflows/temp-finalize-whats-new.yml
          git config user.name "dp-resources-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/changelog.ts app/changelog/page.tsx lib/whats-new.ts tests/whats-new-release-structure.test.ts
          git commit -m "chore: finalize What's New and changelog copy"
          git push origin main
