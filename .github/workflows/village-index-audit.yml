name: Village Question Index Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/question-bank/capture-village.mjs'
      - 'scripts/question-bank/html-utils.mjs'
      - 'tests/village-indexer.test.mjs'
      - 'package.json'
      - '.github/workflows/village-index-audit.yml'

permissions:
  contents: read

concurrency:
  group: village-index-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Use Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'

      - name: Capture safe Village network hints
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/village-index/source"
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          (async () => {
            const appUrl = 'https://village.pirateib.su/';
            const allowed = (u) => {
              try {
                const x = new URL(u, appUrl);
                return x.protocol === 'https:' && (x.hostname === 'village.pirateib.su' || x.hostname.endsWith('.pirateib.su') || x.hostname.endsWith('.pirateib.sh'));
              } catch { return false; }
            };
            const html = await (await fetch(appUrl)).text();
            const scripts = [...html.matchAll(/<script\b[^>]*src=["']([^"']+)["']/gi)]
              .map((m) => new URL(m[1], appUrl).href)
              .filter(allowed);
            const hints = [];
            const contexts = [];
            const sourceMaps = [];
            for (const scriptUrl of [...new Set(scripts)]) {
              const response = await fetch(scriptUrl);
              const source = await response.text();
              const strings = [...source.matchAll(/(["'`])([^\n\r"'`]{1,500})\1/g)].map((m) => m[2]);
              for (const value of strings) {
                const looksNetworkish = /^(?:https?:\/\/|\/|\.\.?\/)/.test(value) || /(?:api|graphql|question|bank|data|asset|worker|\.json|\.ndjson|\.gz|\.br|\.bin|\.db|\.sqlite|\.wasm)/i.test(value);
                const looksPathish = /[/.]/.test(value);
                if (!looksNetworkish || !looksPathish || value.length > 300) continue;
                if (value.includes('<') || value.includes('>')) continue;
                hints.push(value);
              }
              for (const needle of ['.questionData.js', 'questionData', 'assets.revisionvillage.com', 'XMLHttpRequest', 'fetch(']) {
                let from = 0;
                for (let count = 0; count < 20; count += 1) {
                  const at = source.indexOf(needle, from);
                  if (at < 0) break;
                  contexts.push({
                    script: scriptUrl,
                    needle,
                    offset: at,
                    context: source.slice(Math.max(0, at - 350), Math.min(source.length, at + needle.length + 500)).replace(/\s+/g, ' '),
                  });
                  from = at + needle.length;
                }
              }
              const marker = 'sourceMappingURL=data:application/json;base64,';
              const markerAt = source.lastIndexOf(marker);
              if (markerAt >= 0) {
                const encoded = source.slice(markerAt + marker.length).split(/\r?\n/, 1)[0].trim();
                try {
                  const map = JSON.parse(Buffer.from(encoded, 'base64').toString('utf8'));
                  sourceMaps.push({
                    script: scriptUrl,
                    file: map.file || null,
                    source_count: Array.isArray(map.sources) ? map.sources.length : 0,
                    sources: Array.isArray(map.sources) ? map.sources.slice(0, 2000) : [],
                  });
                } catch (error) {
                  sourceMaps.push({ script: scriptUrl, error: error.message });
                }
              }
              hints.push(`SCRIPT_SHA256:${scriptUrl}:${crypto.createHash('sha256').update(source).digest('hex')}`);
            }
            const unique = [...new Set(hints)].sort();
            const root = `${process.env.RUNNER_TEMP}/village-index/source`;
            fs.writeFileSync(`${root}/network-hints.json`, JSON.stringify(unique, null, 2) + '\n');
            fs.writeFileSync(`${root}/loader-contexts.json`, JSON.stringify(contexts, null, 2) + '\n');
            fs.writeFileSync(`${root}/source-map-sources.json`, JSON.stringify(sourceMaps, null, 2) + '\n');
            console.log(`Captured ${unique.length} safe network/source hints and ${contexts.length} loader contexts.`);
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Index live Village metadata and fingerprints
        shell: bash
        run: |
          set +e
          node scripts/question-bank/capture-village.mjs \
            --output "$RUNNER_TEMP/village-index" \
            --no-compare-production
          status=$?
          set -e

          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
          test -s "$RUNNER_TEMP/village-index/index/questions.ndjson"

      - name: Show compact audit summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/village-index/summary.json" ]; then
            cat "$RUNNER_TEMP/village-index/summary.json"
          fi

      - name: Upload metadata-only Village audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: village-index-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/village-index/summary.json
            ${{ runner.temp }}/village-index/checksums.sha256
            ${{ runner.temp }}/village-index/source/source-manifest.json
            ${{ runner.temp }}/village-index/source/json-candidates.json
            ${{ runner.temp }}/village-index/source/network-hints.json
            ${{ runner.temp }}/village-index/source/loader-contexts.json
            ${{ runner.temp }}/village-index/source/source-map-sources.json
            ${{ runner.temp }}/village-index/index/questions.ndjson
            ${{ runner.temp }}/village-index/index/source-summary.json
            ${{ runner.temp }}/village-index/index/failures.json
          if-no-files-found: error
          retention-days: 7
