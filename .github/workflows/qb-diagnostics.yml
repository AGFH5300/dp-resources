name: Question Bank diagnostics

on:
  pull_request:
    paths:
      - 'components/question-bank/**'
      - 'lib/question-bank/**'
      - 'tests/question-bank*.test.*'
      - '.github/workflows/qb-diagnostics.yml'

permissions:
  contents: read

jobs:
  targeted-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: question-bank
            test: tests/question-bank.test.tsx
          - key: render-audit
            test: tests/question-bank-render-audit.test.ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --silent
      - name: Run targeted test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          npx vitest run "${{ matrix.test }}" --reporter=verbose > vitest-${{ matrix.key }}.log 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: vitest-${{ matrix.key }}
          path: vitest-${{ matrix.key }}.log
      - name: Fail when test failed
        if: steps.test.outcome == 'failure'
        run: exit 1
