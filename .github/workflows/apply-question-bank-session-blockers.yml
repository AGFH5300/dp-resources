name: Apply Question Bank session blocker fixes

on:
  push:
    branches:
      - fix/question-bank-session-blockers

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/question-bank-session-blockers
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded source patch
        run: node scripts/apply-question-bank-session-blockers.mjs
      - name: Validate patch
        run: git diff --check
      - name: Commit patched files and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Question Bank session creation blockers"
          git push origin HEAD:fix/question-bank-session-blockers
