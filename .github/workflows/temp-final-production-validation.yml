name: Final production validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-final-production-validation.yml'
      - 'docs/SME_A1_PRODUCTION_AUDIT_2026-09-18.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Test shard 1 of 4
        run: timeout 90s npx vitest run --shard=1/4 --maxWorkers=2
      - name: Test shard 2 of 4
        run: timeout 90s npx vitest run --shard=2/4 --maxWorkers=2
      - name: Test shard 3 of 4
        run: timeout 90s npx vitest run --shard=3/4 --maxWorkers=2
      - name: Test shard 4 of 4
        run: timeout 90s npx vitest run --shard=4/4 --maxWorkers=2
      - run: npm run lint
      - run: npm run build
      - run: npm run security:client-bundle
      - run: npm audit --omit=dev --audit-level=high
