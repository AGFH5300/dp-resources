name: Final production validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-final-production-validation.yml'
      - 'docs/SME_A1_PRODUCTION_AUDIT_2026-09-18.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run complete suite with bounded workers
        run: timeout 240s npx vitest run --maxWorkers=2
      - run: npm run lint
      - run: npm run build
      - run: npm run security:client-bundle
      - run: npm audit --omit=dev --audit-level=high
