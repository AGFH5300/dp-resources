name: Final production validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-final-production-validation.yml'
      - 'docs/SME_A1_PRODUCTION_AUDIT_2026-09-18.md'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Find leaking shard-1 test
        shell: bash
        run: |
          set +e
          bad=0
          for f in \
            tests/disposable-email-and-suspension.test.ts \
            tests/pdf-progressive-loader.test.ts \
            tests/question-bank-practice-builder-production-readiness.test.ts \
            tests/content-source-attribution.test.tsx \
            tests/social-auth.test.ts \
            tests/account-settings.test.ts \
            tests/changelog-page.test.ts \
            tests/question-bank-practice-maximization.test.ts \
            tests/case-attachments.test.ts \
            tests/question-bank-production-rendering.test.tsx \
            tests/pptx-containment.test.ts \
            tests/security-low-findings.test.ts \
            tests/middleware.test.ts \
            tests/library-proactive-prefetch.test.ts \
            tests/question-bank-feedback-fixes.test.ts \
            tests/pdf-search-storage-bridge.test.ts \
            tests/seo-branding.test.ts \
            tests/password-reset.test.ts \
            tests/question-bank-section-context.test.ts \
            tests/library-clarity-repair.test.ts \
            tests/question-bank-answer-feedback-range.test.ts \
            tests/exam-mate-importer.test.mjs \
            tests/resource-content-first-load-reliability.test.ts \
            tests/index-sync-panel.test.ts \
            tests/shared-auth-schema.test.ts \
            tests/render-deployment-contract.test.ts \
            tests/question-bank-large-session-write.test.ts \
            tests/rpc-execute-hardening.test.ts \
            tests/pdf-search-manifest.test.ts \
            tests/question-bank-asset-alias-api.test.ts \
            tests/question-bank-pagination.test.ts \
            tests/frontend-secret-boundary.test.ts \
            tests/mobile-header-and-pdf-delivery.test.ts \
            tests/pdf-manifest-pagination.test.ts \
            tests/question-bank-practice-selection-label.test.ts \
            tests/pdf-preview-version-normalization.test.ts \
            tests/question-bank-practice-builder-hardening.test.ts \
            tests/scoped-resource-search.test.ts \
            tests/resource-search-result-limit.test.ts \
          ; do
            echo "===== $f ====="
            timeout 15s npx vitest run "$f" --pool=threads --maxWorkers=1
            rc=$?
            if [ "$rc" -eq 124 ]; then
              echo "HANGING_TEST=$f"
              bad=1
            elif [ "$rc" -ne 0 ]; then
              echo "FAILING_TEST=$f rc=$rc"
              bad=1
            fi
          done
          exit "$bad"
