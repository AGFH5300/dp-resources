name: Final production validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-final-production-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run complete test suite
        run: timeout 240s npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run security:client-bundle
      - run: npm audit --omit=dev --audit-level=high
      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name "dp-resources-validation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-final-production-validation.yml
          git commit -m "chore: remove final production validation"
          git push origin main
