name: Final production validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-final-production-validation.yml'
      - 'docs/SME_A1_PRODUCTION_AUDIT_2026-09-18.md'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run release and tutorial regressions
        run: >
          npx vitest run
          tests/tutorial-onboarding.test.ts
          tests/admin-private-aliases-and-question-bank-activity.test.ts
          tests/post-production-live-data-release-audit.test.ts
          tests/post-production-release-audit.test.ts
          tests/frontend-secret-boundary.test.ts
          tests/admin-activity-user-links.test.ts
          tests/source-ui-and-whats-new.test.ts
          tests/whats-new-release-structure.test.ts
      - run: npm run lint
      - run: npm run build
      - run: npm run security:client-bundle
      - run: npm audit --omit=dev --audit-level=high
      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name "dp-resources-validation-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-final-production-validation.yml
          git commit -m "chore: remove final production validation"
          git push origin main
