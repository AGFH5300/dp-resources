name: Dispatch one-time Exam-Mate integrity repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-exam-mate-integrity-repair.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch guarded repair with pinned variant reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/exam-mate-integrity-repair.yml/dispatches" \
            --data '{"ref":"main","inputs":{"confirmation":"REPAIR-EXAM-MATE-PRODUCTION-INTEGRITY"}}'
