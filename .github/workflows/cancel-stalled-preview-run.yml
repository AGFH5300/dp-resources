name: Cancel stalled textbook preview run

on:
  push:
    branches:
      - ops/textbook-library-finalize-2026-09-08
    paths:
      - .github/workflows/cancel-stalled-preview-run.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stalled run 34260800573
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/34260800573"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          status="$(curl -fsSL "${headers[@]}" "$API" | jq -r '.status')"
          echo "status before cancellation: $status"
          if [ "$status" != "completed" ]; then
            code="$(curl -sS -o /tmp/cancel.txt -w '%{http_code}' -X POST "${headers[@]}" "$API/cancel")"
            echo "cancel response: HTTP $code"
            if [ "$code" != "202" ] && [ "$code" != "409" ]; then
              cat /tmp/cancel.txt || true
              exit 1
            fi
          fi
          for _ in $(seq 1 60); do
            status="$(curl -fsSL "${headers[@]}" "$API" | jq -r '.status')"
            if [ "$status" = "completed" ]; then
              conclusion="$(curl -fsSL "${headers[@]}" "$API" | jq -r '.conclusion')"
              echo "stalled run retired: $conclusion"
              exit 0
            fi
            sleep 2
          done
          echo "run did not settle after cancellation"
          exit 1
