name: Refresh security lockfile

on:
  push:
    branches:
      - fix/dependency-security-alerts

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[skip lock-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out security branch
        uses: actions/checkout@v4
        with:
          ref: fix/dependency-security-alerts
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate package lock from patched overrides
        run: npm install --package-lock-only --ignore-scripts

      - name: Show patched dependency tree
        continue-on-error: true
        run: npm ls brace-expansion postcss shell-quote

      - name: Capture complete dependency audit
        shell: bash
        run: npm audit --json > .security-audit.json || true

      - name: Commit generated security files
        shell: bash
        run: |
          git add package-lock.json .security-audit.json
          if git diff --cached --quiet; then
            echo "Generated security files were already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: capture secure dependency lockfile [skip lock-refresh]"
            git push origin HEAD:fix/dependency-security-alerts
          fi

      - name: Verify complete dependency audit
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('.security-audit.json', 'utf8'));
          const totals = audit.metadata?.vulnerabilities || {};
          const highOrCritical = Number(totals.high || 0) + Number(totals.critical || 0);
          if (highOrCritical > 0) {
            console.error(`Audit still contains ${highOrCritical} high/critical vulnerabilities.`);
            process.exit(1);
          }
          console.log('No high or critical vulnerabilities remain.');
          NODE
