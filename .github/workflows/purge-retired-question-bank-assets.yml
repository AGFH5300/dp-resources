name: One-time retired Question Bank asset purge

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/purge-retired-question-bank-assets.yml
      - scripts/purge-retired-question-bank-assets.mjs

permissions:
  contents: read

concurrency:
  group: retired-question-bank-asset-purge
  cancel-in-progress: false

jobs:
  purge:
    name: Delete and verify retired R2 assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      PURGE_CONFIRMATION: DELETE RETIRED QUESTION BANK ASSETS

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate destructive-operation credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$R2_ACCOUNT_ID" || test -n "$R2_ENDPOINT"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          test "$PURGE_CONFIRMATION" = "DELETE RETIRED QUESTION BANK ASSETS"

      - name: Delete and HEAD-verify exact retired asset queue
        run: node scripts/purge-retired-question-bank-assets.mjs
