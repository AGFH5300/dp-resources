name: Apply final Question Bank compatibility updates

on:
  push:
    paths:
      - '.github/workflows/apply-qb-final-compat.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply exact compatibility changes
        shell: python
        run: |
          from pathlib import Path

          content = Path('components/question-bank/question-content.tsx')
          text = content.read_text()
          if 'authorised archive' not in text:
              raise SystemExit('Expected unavailable-image wording was not found')
          content.write_text(text.replace('authorised archive', 'authorized archive'))

          test = Path('tests/question-bank.test.tsx')
          text = test.read_text()
          old = """    expect(workspace).toContain(\"? 'group'\");
              expect(workspace).toContain(\": 'radiogroup'\");
          """
          new = """    expect(workspace).toContain(\"'group'\");
              expect(workspace).toContain(\"'radiogroup'\");
              expect(workspace).toContain(\"'checkbox'\");
              expect(workspace).toContain(\"'radio'\");
          """
          if old not in text:
              raise SystemExit('Expected role assertions were not found')
          test.write_text(text.replace(old, new, 1))
      - name: Commit updates
        shell: bash
        run: |
          git config user.name 'dp-resources-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add components/question-bank/question-content.tsx tests/question-bank.test.tsx
          git commit -m 'Preserve Question Bank compatibility contracts'
          git push origin HEAD:${GITHUB_REF_NAME}
