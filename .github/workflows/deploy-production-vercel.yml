name: Deploy production to Vercel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-production-vercel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Require existing Vercel project credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "$name is not configured in GitHub Actions secrets." >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo 'Aborting before any Vercel project/link/deploy operation.' >&2
            exit 1
          fi

      - name: Pull existing production project configuration
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production deployment
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy exact prebuilt output to production
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Verify production PDF search marker
        shell: bash
        run: |
          set -euo pipefail
          url='https://dp.resources.anshgupta.cc/api/health/pdf-search-storage'
          for attempt in $(seq 1 30); do
            body="$(curl --silent --show-error --fail --max-time 15 --header 'Cache-Control: no-cache' "$url" || true)"
            if printf '%s' "$body" | grep -Fq '"pdfSearchStorage":"dual-object-v1"'; then
              echo "Production deployment verified: $body"
              exit 0
            fi
            sleep 10
          done
          echo 'Vercel deploy command completed but the production health marker did not become live.' >&2
          exit 1
