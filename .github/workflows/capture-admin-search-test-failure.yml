name: Capture admin search test failure

on:
  push:
    branches: [fix/admin-unified-content-search]
    paths:
      - .github/workflows/capture-admin-search-test-failure.yml

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-unified-content-search
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture test output
        run: |
          set +e
          npm test > /tmp/test-output.txt 2>&1
          code=$?
          tail -n 400 /tmp/test-output.txt > admin-search-test-output.txt
          cat admin-search-test-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-search-test-output.txt
          git commit -m "Record unified admin search test output"
          git push origin HEAD:fix/admin-unified-content-search
          exit "$code"
