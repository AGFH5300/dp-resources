name: Apply folder search fix on pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/folder-search-admin-case-state' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply prepared source patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          patch_path = Path('tests/.apply-folder-search-admin-fix.py')
          try:
              exec(compile(patch_path.read_text(), str(patch_path), 'exec'))
          except Exception as error:
              Path('tests/patch-error.txt').write_text(
                  f'{type(error).__name__}: {error}\n'
              )
          patch_path.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib supabase tests
          git commit -m "Apply folder search and admin case-state source changes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
