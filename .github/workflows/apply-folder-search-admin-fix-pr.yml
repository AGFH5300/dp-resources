name: Apply folder search fix on pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/folder-search-admin-case-state' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply prepared source patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          patch_path = Path('tests/.apply-folder-search-admin-fix.py')
          try:
              exec(compile(patch_path.read_text(), str(patch_path), 'exec'))
          except Exception as error:
              Path('tests/patch-error.txt').write_text(
                  f'{type(error).__name__}: {error}\n'
              )
          patch_path.unlink()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: folder-search-admin-fix
          if-no-files-found: error
          path: |
            app/admin/admin-console.tsx
            app/api/search/route.ts
            app/library/page.tsx
            components/folder-search-button.tsx
            components/global-search.tsx
            lib/changelog.ts
            supabase/migrations/20260728153000_folder_scoped_resource_search.sql
            tests/folder-search-admin-state.test.ts
            tests/patch-error.txt
