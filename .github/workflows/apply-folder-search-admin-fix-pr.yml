name: Apply folder search fix on pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/folder-search-admin-case-state' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply prepared source patch
        shell: bash
        run: |
          python3 <<'BOOT'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/apply-folder-search-admin-fix.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit('Prepared patch script was not found.')
          source = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(dedent(source), 'prepared-folder-search-patch.py', 'exec'))
          BOOT

          rm .github/workflows/apply-folder-search-admin-fix.yml
          rm .github/workflows/apply-folder-search-admin-fix-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib supabase tests .github/workflows
          git commit -m "Add folder-scoped search and isolate admin case state"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
